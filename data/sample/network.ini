# Settings for the Phnom Penh sample network. Every key is optional.

# Flat fare per boarding; changing lines means paying again.
fare_khr = 1500

walk_speed_kmh = 4.5
# Walking between stops is allowed up to this street distance.
walk_radius_m = 400
# How far a lat,lon origin or destination may be from a stop.
access_radius_m = 800
# Street distance is estimated as straight-line distance times this factor.
detour_factor = 1.3

# Extra cost of changing buses, on top of the expected wait.
transfer_penalty_s = 120
# "walk" mode counts each walking minute as this many minutes.
walk_weight = 4

# Used for lines.csv rows that leave these columns empty. City buses run
# every 10-20 minutes in normal traffic.
default_headway_min = 15
default_min_between_stops = 2
